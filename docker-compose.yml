services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: postgis_br
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-address_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
    ports:

      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Armazenamento configuravel via POSTGRES_DATA_DIR (.env) ou fallback para ./.pgdata
      - ${POSTGRES_DATA_DIR:-./.pgdata}:/var/lib/postgresql/data
      # Scripts SQL do repositorio
      - ./sql:/sql:ro
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

