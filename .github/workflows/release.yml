#
# Only run on tag
# Only release of the tag name is identical to the full version
#

name: 'Release'

on:
  push:
    tags:
      - '*.*'

jobs:
  release:
    name: 'Release on Tag'
    runs-on: ubuntu-latest

    # Only run release on central repo
    if: github.repository == 'postgis/address_standardizer'
    steps:

    - uses: actions/checkout@v6

    - name: Get tag
      id: tag
      run: |
        TAG="${GITHUB_REF_NAME}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - name: 'Read Version'
      id: version
      run: |
        pwd
        AS_VERSION=$(grep default address_standardizer.control | cut -f2 -d'=' | tr -d "' ")
        echo AS_VERSION $AS_VERSION
        echo "asversion=${AS_VERSION}" >> "$GITHUB_OUTPUT"

    - name: 'Validate Release Version'
      run: |
        if [ "${{ steps.tag.outputs.version }}" != "${{ steps.version.outputs.asversion }}" ]; then
          echo "::error::Tag ${{ steps.tag.outputs.tag }} does not match address_standardizer.control version ${{ steps.version.outputs.asversion }}"
          exit 1
        fi

    - name: 'Create Release Notes'
      id: notes
      run: |
        pwd
        perl tools/releasenotes.pl NEWS.md > release.md
        echo "asnotes=./release.md" >> "$GITHUB_OUTPUT"

    - name: Install postgresql-server-dev
      id: installpg
      run: |
        PG_VERSION=$(pg_config --version | awk '{print $2}' | cut -d. -f1)
        echo "Detected PostgreSQL major version: $PG_VERSION"
        sudo apt-get update
        sudo apt-get install -y postgresql-server-dev-$PG_VERSION

    - name: 'Bundle & Check Package'
      id: bundle
      run: |
        pwd
        set -e
        make with_llvm=no && make dist

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        body_path: ${{ steps.notes.outputs.asnotes }}
        name: Release ${{ steps.version.outputs.asversion }}
        prerelease: false
        files: |
          ./address_standardizer-*.tar.gz

