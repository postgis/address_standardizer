# GitHub Actions for address_standardizer
#
# Paul Ramsey <pramsey at cleverelephant dot ca>

name: "CI"
on: [push, pull_request]

jobs:
  linux:
    name: PG ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container:
      image: pgxn/pgxn-tools
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18, 19]

    steps:

    - name: 'Check Out'
      uses: actions/checkout@v6

    - name: 'Start PostgreSQL ${{ matrix.pg }}'
      run: pg-start ${{ matrix.pg }}

    - name: 'Install libcurl'
      run: |
        apt-get update
        apt-get -y install libpcre2-dev


    - name: 'Build & Install'
      run: |
        export PG_CFLAGS=-Werror
        make && make install

    - name: 'Test'
      run: PGUSER=postgres make installcheck || (cat test/regression.diffs 2>/dev/null || cat regression.diffs 2>/dev/null; false)

